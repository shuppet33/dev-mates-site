name: Update site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" || { echo "SERVER_SSH_KEY пуст"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "SERVER_KNOWN_HOSTS пуст"; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update site on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST" || { echo "SERVER_HOST пуст"; exit 1; }
          test -n "$SERVER_USER" || { echo "SERVER_USER пуст"; exit 1; }

          ssh-keygen -F "[$SERVER_HOST]:2223" -f ~/.ssh/known_hosts > /dev/null ||
            { echo "SERVER_KNOWN_HOSTS: нет записи для SERVER_HOST на порту 2223"; exit 1; }

          ssh -p 2223 -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            'cd /var/www/dev-mates-site && git pull --ff-only origin main'